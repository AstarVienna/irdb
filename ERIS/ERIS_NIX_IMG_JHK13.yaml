---
### ERIS NIX JHK 13mas/pix imaging mode
object: instrument
alias: INST
name: ERIS_NIX_IMG_JHK13
description: NIX JHK-band 13mas/pix imaging mode (26.4 arcsec FoV)

properties:
  pixel_scale: 0.01309        # arcsec/pixel (13.09 mas/pix measured)
  plate_scale: 0.7272         # arcsec/mm (18um pixels -> 13.09mas)

effects:
  - name: nix_field_of_view
    description: NIX JHK-13mas field of view (26.4 x 26.4 arcsec)
    class: ApertureMask
    kwargs:
      array_dict:
        x: [-13.2, 13.2, 13.2, -13.2]
        y: [-13.2, -13.2, 13.2, 13.2]
      x_unit: arcsec
      y_unit: arcsec

  - name: nix_camera_optics
    description: NIX JHK-13mas camera barrel (3 lenses + fold mirrors)
    class: SurfaceList
    kwargs:
      filename: LIST_ERIS_nix_optics_jhk13.dat

---
### Override simulation spectral range for JHK modes
object: simulation
alias: SIM
name: ERIS_NIX_JHK_sim_params

properties:
  spectral:
    wave_min: 0.9
    wave_mid: 1.6
    wave_max: 2.6
