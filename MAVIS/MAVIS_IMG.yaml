### MAVIS imager mode
object: instrument
alias: INST
name: MAVIS_IMG
description: >
  MAVIS imager mode. 30x30 arcsec FoV, 7.36 mas/pixel, visible wavelengths.
  Filters: Bessel BVRI and SDSS u'g'r'i'z'.

effects:
  - name: mavis_ao_psf
    description: >
      MAVIS MCAO PSF. Analytic model: obscured VLT Airy core plus an
      AO-corrected halo plus the residual seeing halo, calibrated at 550 nm to
      the published Strehl (10%) and ensquared energy (15% in a 50 mas box).
      Generated by background_info/make_psf.py. It has no field variability or
      anisoplanatism; substitute a MAVISIM or LAM end-to-end PSF for
      science-grade results.
    class: FieldConstantPSF
    kwargs:
      filename: PSF_MAVIS_analytic.fits
      warning: "Analytic MCAO PSF model, not an end-to-end simulation."

  - name: mavis_filter_wheel
    description: MAVIS imager filter wheel (Bessel BVRI + SDSS u'g'r'i'z')
    class: FilterWheel
    kwargs:
      filter_names:
        - B
        - V
        - R
        - I
        - u
        - g
        - r_SDSS
        - i_SDSS
        - z
      filename_format: "!INST.filter_file_format"
      current_filter: "!OBS.filter_name"
