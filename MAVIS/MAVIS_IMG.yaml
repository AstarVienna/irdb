### MAVIS imager mode
object: instrument
alias: INST
name: MAVIS_IMG
description: >
  MAVIS imager mode. 30x30 arcsec FoV, 7.36 mas/pixel, visible wavelengths.
  Filters: Bessel BVRI and SDSS u'g'r'i'z'.

effects:
  - name: mavis_ao_psf
    description: >
      MAVIS MCAO PSF. The 550 nm plane is the on-axis end-to-end MCAO PSF
      from MAVISIM (Monty et al. 2021; LQG tomography simulations by
      J. Cranney, ANU), so V-band images match MAVISIM. The other wavelength
      planes are an analytic model (obscured VLT Airy core + AO-corrected
      halo + seeing halo) calibrated to the measured 550 nm Strehl (0.35)
      and ensquared energy (0.40 in a 50 mas box), with Marechal wavelength
      scaling. Generated by background_info/make_psf.py. It has no field
      variability or anisoplanatism; substitute the field-varying MAVISIM
      PSF grid for astrometric science cases.
    class: FieldConstantPSF
    kwargs:
      filename: PSF_MAVIS_mcao.fits
      warning: "On-axis PSF only: no field variability or anisoplanatism."

  # Alternative: generate the PSF on the fly with ESO's TipTop AO simulator
  # (via the tiptop_ipy package and the University of Vienna TipTop server).
  # One PSF is generated per filter band (at the filter's effective
  # wavelength) and cached on disk, so each band costs one server call ever.
  # Note that TipTop's default MAVIS configuration is more conservative than
  # the MAVISIM LQG simulations: Strehl(550nm) = 0.23 vs 0.35, and 30-40%
  # less energy inside apertures below 150 mas.
  # To use it, set "include: True" here and "include: False" on mavis_ao_psf,
  # e.g. from python:
  #     opt["mavis_ao_psf"].include = False
  #     opt["mavis_tiptop_psf"].include = True
  - name: mavis_tiptop_psf
    description: >
      MAVIS MCAO PSF generated by the TipTop AO simulator (one PSF per
      filter band, cached on disk, max 1024x1024 pixels).
    class: TipTopPSF
    include: False
    kwargs:
      instrument: MAVIS
      filter_name: "!OBS.filter_name"
      wave_dict:
        B: 0.426
        V: 0.545
        R: 0.641
        I: 0.798
        u: 0.356
        g: 0.470
        r_SDSS: 0.618
        i_SDSS: 0.749
        z: 0.895
      fov_pix: 1024
      pixel_scale: 0.00368
      cache_dir: "./tiptop_psf_cache"
      warning: "On-axis PSF only: no field variability or anisoplanatism."

  - name: mavis_filter_wheel
    description: MAVIS imager filter wheel (Bessel BVRI + SDSS u'g'r'i'z')
    class: FilterWheel
    kwargs:
      filter_names:
        - B
        - V
        - R
        - I
        - u
        - g
        - r_SDSS
        - i_SDSS
        - z
      filename_format: "!INST.filter_file_format"
      current_filter: "!OBS.filter_name"
