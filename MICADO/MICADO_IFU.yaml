---
### MICADO IFU mode
object: instrument
alias: INST
name: MICADO_IFU
description: additional effects for the IFU mode
date_modified: 2026-04-07
changes:
  - 2026-04-07 (OC) include image slicer

properties:
  pixel_scale: 0.004          # arcsec / pixel
  plate_scale: 0.266666666666 # arcsec / pixel
  decouple_detector_from_sky_headers: True   # needed for spectroscopy

effects:
  - name: image_slicer
    description: field of view of the image slicer
    class: MetisLMSImageSlicer
    kwargs:
      filename: "!OBS.trace_file"
      ext_id: "Aperture List"

  - name: spectral_traces
    description: spectral order trace geometry on the focal plane
    class: MicadoIFUSpectralTraceList
    kwargs:
      filename: "!OBS.trace_file"
      wave_colname: "wavelength"
      s_colname: "xi"
      col_number_start: 1
      slice_samples: 5  # number of samples along slice width

---
### set observation mode
object: observation
alias: OBS
name: MICADO_IFU

properties:
  obs_mode: "IFU"
  fits_ins_mode: "IFU"
