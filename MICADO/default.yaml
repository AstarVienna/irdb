---
### default observation parameters needed for a MICADO simulation

object: configuration
alias: OBS
name: MICADO_default_configuration
description: default parameters needed for a MICADO simulation
status: development
needs_scopesim: "v0.11.3"
date_modified: 2025-10-09
changes:
  - 2023-07-13 (OC) add modes for FDR slits, deprecate pre-FDR slits
  - 2025-06-27 (FH) add needs_scopesim keyword
  - 2025-10-09 (OC) proper MJD value
  - 2025-10-17 (JB) add parametes for FITS keywords, tplstart as MJD
  - 2026-01-02 (OC) random seed to None
  - 2026-04-09 (OC) new SPEC mode, rename slits

packages:
- Armazones
- ELT
- MORFEO
- MICADO

yamls:
- Armazones.yaml
- ELT.yaml
- MICADO.yaml
- MICADO_H4RG.yaml

properties :
  instrument : MICADO
  modes : ["SCAO", "IMG_4mas"]
  airmass : 1.2
  declination : -30
  hour_angle : 0
  pupil_angle : 0
  slit: false   # overridden in spectroscopic modes
  dit : 60
  ndit : 1
  catg : SCIENCE
  tech : IMAGE
  type : OBJECT
  # Should be datetimes, but is copied verbatim, so should work.
  mjdobs : 61529.104
  tplstart : 61529.104
  tplexpno : 0
  tplno : 0
  obsname : "MyScienceTest"
  ra : 0.0
  dec : 0.0
  # default FITS parameters
  fits_ins_mode: "LRI"
  fits_ins_mask: "Large"
  fits_ins_slit: ""
  fits_ins_coro: ""
  fits_ins_stop: ""
  fits_ins_filt: ""

mode_yamls :
- object : instrument
  alias: OBS
  name : SCAO
  description : "SCAO optical system"
  yamls :
  - MICADO_Standalone_RO.yaml

- object : instrument
  alias: OBS
  name : MCAO
  description : "MCAO optical system"
  yamls :
  - MORFEO.yaml
  properties :
    ins_mode: "MCAO"

- object : observation
  alias: OBS
  name : IMG_4mas
  description : "wide-field imager  : 4mas/pix"
  status: development
  yamls :
  - MICADO_IMG_wide.yaml
  properties :
    filter_name_fw1: open
    filter_name_fw2: Ks
    filter_name_pupil: open
    fits_ins_filt: Ks

- object : observation
  alias: OBS
  name : IMG_1.5mas
  description : "high resolution imager  : 1.5mas/pix"
  status: development
  yamls :
  - MICADO_IMG_zoom.yaml
  properties :
    filter_name_fw1: open
    filter_name_fw2: Ks
    filter_name_pupil: open
    fits_ins_filt: Ks

- object : observation
  alias: OBS
  name : IMG_HCI
  description : "High contrast imaging"
  status: experimental
  yamls :
  - MICADO_IMG_HCI.yaml

- object: observation
  alias: OBS
  name: SPEC
  description: "spectrograph: all slits"
  status: development
  yamls:
  - MICADO_SPEC.yaml
  properties:       # Todo: these parameters all need to be changeable
    trace_file: TRACE_MICADO.fits
    slit: Short
    filter_name_fw1: Spec_IJ
    filter_name_fw2: open
    filter_name_pupil: open
    tech: SPEC
    fits_ins_mode: SPE
    fits_ins_filt: Spec_IJ

- object : observation
  alias: OBS
  name : SPEC_15000x20
  description : "spectrograph : slit size 15000x20mas"
  status: deprecated
  deprecate: "Deprecated mode, use SPEC with '!OBS.slit'='Long' instead"
  yamls :
  - MICADO_SPEC.yaml
  properties :
    trace_file : TRACE_MICADO.fits
    slit : Long
    filter_name_fw1 : Spec_HK
    filter_name_fw2 : open
    filter_name_pupil : open
    fits_ins_filt : Spec_HK

- object : observation
  alias: OBS
  name : SPEC_3000x48
  description : "spectrograph : slit size 3000x48mas"
  status: deprecated
  deprecate: "Deprecated mode, use SPEC with '!OBS.slit'='Wide' instead"
  yamls :
  - MICADO_SPEC.yaml
  properties :
    trace_file : TRACE_MICADO.fits
    slit : Wide
    filter_name_fw1 : Spec_HK
    filter_name_fw2 : open
    filter_name_pupil : open
    fits_ins_filt : Spec_HK

- object : observation
  alias : OBS
  name : SPEC_3000x16
  description : "spectrograph : slit size 3000x16mas"
  status: deprecated
  deprecate: "Deprecated mode, use SPEC with '!OBS.slit'='Short' instead"
  yamls :
  - MICADO_SPEC.yaml
  properties :
    trace_file : TRACE_MICADO.fits
    slit: Short
    filter_name_fw1 : Spec_IJ
    filter_name_fw2 : open
    filter_name_pupil : open
    fits_ins_filt : Spec_IJ

---
### default simulation parameters needed for a MICADO simulation
object : simulation
alias : SIM
name : MICADO_simulation_parameters
description : RC simulation parameters which need to change for a MICADO run

properties :
  random :
    seed : None                 # 9001

  spectral :
    wave_min : 0.7
    wave_mid : 1.6
    wave_max : 2.5

  sub_pixel:
    flag: True

  computing :
    preload_field_of_views : True

  reports:
    preamble_file: "../docs/micado.rst"
