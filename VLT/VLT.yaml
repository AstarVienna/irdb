### VLT Unit Telescope 4
object: instrument
alias: TEL
name: VLT
description : The very large telescope UT4

properties:
  temperature: "!ATMO.temperature"

effects:
- name: vlt_mirror_list
  class: SurfaceList
  kwargs:
    filename: LIST_VLT_mirrors.dat

- name: vlt_generic_psf
  description: Field constant PSF
  class: FieldConstantPSF
  kwargs:
    filename: PSF_VLT_poppy.fits
    warning: "Default PSF was generated Poppy for a UT4 optical system"
    interp_psf: "!SIM.psf.interp_psf"
    interp_order: "!SIM.psf.interp_order"


---
### default simulation parameters
object: simulation
alias: SIM
name: VLT_simulation_parameters
description: RC simulation parameters for VLT simulations

properties:
  psf:
    interp_psf: True
    interp_order: 1
