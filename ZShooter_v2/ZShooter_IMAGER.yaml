object: instrument
alias: INST
name: ZIMAGE
description: Effects from the ZIMAGE optics

#properties:

# There are 3 image planes in ZIMAGE: 3 filters. We use the DichroicTree effect to establish the branching
# in the beginning of the flow, using aperture_id as the identifying key. Though physically there may be other
# optical elements in between dichroics, here all dichroics are considered together in a tree. Other effects that
# act selectively on different arms can be orchestrated using SelectorWheel effects.

effects:
 - name: dichroic_tree
   class: DichroicTree
   include: True
   kwargs:
     tree_filename: "dichroics/zimage_dichroic_tree.dat"
     dichroic_names:
       - A-BC     # First dichroic, splits beam into A and BC
       - B-C      # Next dichroic in BC arm, splits B from C
     filename_format: "dichroics/TER_dichroic_{}.dat"

 - name: channel_optics_selector
   description: ZIMAGE channel optics
   class: SelectorWheel
   include: True
   kwargs:
     z_order: [610]
     selector_key: "aperture_id"
     wheel:
       - selector_value: [0]
         effect_class: SurfaceList
         effect_kwargs:
           filename: "optics/LIST_zimage_filter_A_optics.dat"

       - selector_value: [1]
         effect_class: SurfaceList
         effect_kwargs:
           filename: "optics/LIST_zimage_filter_B_optics.dat"

       - selector_value: [2]
         effect_class: SurfaceList
         effect_kwargs:
           filename: "optics/LIST_zimage_filter_C_optics.dat"


