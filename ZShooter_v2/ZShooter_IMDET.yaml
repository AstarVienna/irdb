### ZShooter_v2 DETECTORs for ZIMAGE
object : detector
alias : DET
name : zimage_detectors
description : 3 CMOS

properties :
    temperature : -35
    binx : 1
    biny: 1
    full_well: 7000
    pixel_scale_A: 0.0511  #"/pix
    pixel_scale_B: 0.0511
    pixel_scale_C: 0.0511
    plate_scale_A: 11.1087 #"/mm
    plate_scale_B: 11.1087
    plate_scale_C: 11.1087

effects :
  - name: detector_u
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 0
        pixel_scale: "!DET.pixel_scale_u"
        plate_scale: "!DET.plate_scale_u"
        array_dict:
          id: [0]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [4096]
          y_size: [2304]
          pixel_size: [0.0046]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "CMOS_u"

  - name: detector_v
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 1
        pixel_scale: "!DET.pixel_scale_v"
        plate_scale: "!DET.plate_scale_v"
        array_dict:
          id: [1]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [4096]
          y_size: [2304]
          pixel_size: [0.0046]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "CMOS_v"

  - name: detector_z
    include: True
    class: DetectorList
    kwargs:
        image_plane_id : 2
        pixel_scale: "!DET.pixel_scale_z"
        plate_scale: "!DET.plate_scale_z"
        array_dict:
          id: [2]
          x_cen: [0.0]
          y_cen: [0.0]
          x_size: [4096]
          y_size: [2304]
          pixel_size: [0.0046]
          angle: [0.0]
          gain: [1.0]
        x_cen_unit: mm
        y_cen_unit: mm
        x_size_unit: pixel
        y_size_unit: pixel
        pixel_size_unit: mm
        angle_unit: deg
        gain_unit: electron/adu
        detector: "CMOS_z"

  - name: exposure_integration_selector
    description: Summing up sky signal for all DITs and NDITs for different detectors
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0]
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.imager_dit_u"
            ndit: "!OBS.imager_ndit_u"
        - selector_value: [1]
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.imager_dit_v"
            ndit: "!OBS.imager_ndit_v"
        - selector_value: [2]
          effect_class: ExposureIntegration
          effect_kwargs:
            dit: "!OBS.imager_dit_z"
            ndit: "!OBS.imager_ndit_z"


  - name: shot_noise
    description : apply poisson shot noise to images
    class: ShotNoise

  - name: dark_current_selector
    description: Selector Wheel for dark current levels for CMOS
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id"
      wheel:
        - selector_value: [0]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.006    # [e-/s] level of dark current
            dit: "!OBS.imager_dit_u"
            ndit: "!OBS.imager_ndit_u"
        - selector_value: [1]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.006    # [e-/s] level of dark current
            dit: "!OBS.imager_dit_v"
            ndit: "!OBS.imager_ndit_v"
        - selector_value: [2]
          effect_class: DarkCurrent
          effect_kwargs:
            value: 0.006     # [e-/s] level of dark current
            dit: "!OBS.imager_dit_z"
            ndit: "!OBS.imager_ndit_z"

  - name: detector_linearity_selector
    description: Selector Wheel for linearity characteristics for CMOS
    class: SelectorWheel
    include: False
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0]
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 7e3]
              measured: [0, 7e3]
            ndit: "!OBS.imager_ndit_u"
        - selector_value: [1]
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 7e3]
              measured: [0, 7e3]
            ndit: "!OBS.imager_ndit_v"
        - selector_value: [2]
          effect_class: LinearityCurve
          effect_kwargs:
            array_dict:
              incident: [0, 7e3]
              measured: [0, 7e3]
            ndit: "!OBS.imager_ndit_z"

  - name: readout_noise_selector
    description: Selector Wheel for readout noise levels for CMOS
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: 0.3
            ndit: "!OBS.imager_ndit_u"
        - selector_value: [1]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: 0.3
            ndit: "!OBS.imager_ndit_v"
        - selector_value: [2]
          effect_class: BasicReadoutNoise
          effect_kwargs:
            noise_std: 0.3
            ndit: "!OBS.imager_ndit_z"

  - name: bias_selector
    description: Selector Wheel for bias levels for CMOS
    class: SelectorWheel
    include: True
    kwargs:
      selector_key: "detector_id" # not really used as the Detector object's id is stored as just "id", but kept for consistency
      wheel:
        - selector_value: [0,1,2]
          effect_class: Bias
          effect_kwargs:
            bias: 200    #  bias level in electrons
