---
### default observation parameters needed for ZShooter simulation

object: configuration
alias: OBS
name: ZShooter_default_configuration
description: default config for zshooter sim
status: development
version: 0.1

packages:
- MaunaKea
- Keck
- ZShooter_v2

yamls:
- MaunaKea.yaml
- Keck.yaml
- ZShooter.yaml

properties:
  instrument : ZShooter_v2
  modes : ["SPEC"]
  pupil_angle : 0
  object : "Test"
#  alt: 90.0              # Make sure to set altitude and airmass consistently, or only set one of them.
  az: 0.0
  airmass : 1.0          # altitude, if set and different from airmass will override airmass
  seeing: 0.7
  brightness : "dark"    # Sky brightness, can be "dark", "grey", or "bright"
  dit_blue : 300.0              # exposure time for B arm
  ndit_blue : 1                # number of exposures for B arm
  dit_green : 300.0              # exposure time for G arm
  ndit_green : 1                # number of exposures for G arm
  dit_red : 300.0              # exposure time for R arms
  ndit_red : 1                # number of exposures for R arms
  dit_yj: 300.0              # exposure time for YJ arms
  ndit_yj: 1                # number of exposures for YJ arms
  dit_h: 300.0              # exposure time for H arms
  ndit_h: 1                # number of exposures for H arms
  dit_k: 300.0              # exposure time for K arms
  ndit_k: 1                # number of exposures for K arms

mode_yamls:
- object: instrument
  alias: OBS
  name : SPEC
  description : "spectroscopic mode"
  yamls :
    - ZShooter_SPEC.yaml
    - ZShooter_DET.yaml

---
### default simulation parameters needed for a MICADO simulation
object : simulation
alias : SIM
name : ZShooter_simulation_paramters
description : RC simulation paramters which need to change for a zshooter run

properties :
  sub_pixel:
    flag : True
#  random :
#    seed : 9001

  spectral :
    wave_unit : "um"
    wave_min : 0.3
    wave_mid : 1.0
    wave_max : 2.5
    spectral_bin_width: 0.00001 # in um, may want 0.000005
    spectral_resolution: 40000

  computing :
    preload_field_of_views : True

#  reports:
#    preamble_file: "../docs/.rst"
